<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Operations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        body { padding: 20px;  }
        .container { margin-top: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .task-item { padding: 10px; margin: 5px 0; border-left: 4px solid #667eea; background: #f8f9fa; transition: all 0.3s; }
        .task-item:hover { transform: translateX(5px); }
        h1 { color: rgb(133, 78, 78); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4"> Student Task Management</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <label for="input" class="form-label fw-bold">Add New Task</label> 
                        <div class="input-group">
                            <input type="text" class="form-control" id="input" placeholder="Enter a task..." autocomplete="off">
                            <button onclick="createTask()" class="btn btn-primary" id="addBtn">Add Task</button>
                        </div>
                        <div id="message" class="mt-2"></div>
                    </div>
                </div>
                <div id="taskList" class="mt-4"></div>
            </div>
        </div>
    </div>
    <script src="../SCRIPT/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
